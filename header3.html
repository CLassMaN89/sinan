<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Başlık 3 — Holografik Cam</title>
<style>
  :root{
    --bg:#070a10; --line:#1c2430; --text-hi:#e7ecf5; --text-md:#8993a5; --text-lo:#525a68;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:10px; }

  .strip{
    height:80px; position:relative; display:flex; align-items:center; gap:20px;
    background:linear-gradient(115deg, rgba(79,140,230,0.10) 0%, rgba(150,109,230,0.08) 35%, rgba(56,214,196,0.08) 70%, rgba(230,79,122,0.08) 100%);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:0 26px; white-space:nowrap; overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .item{ display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .holo{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    background:linear-gradient(135deg, rgba(79,140,230,.28), rgba(150,109,230,.22));
    border:1px solid rgba(255,255,255,.12);
  }
  .item .tx{ display:flex; flex-direction:column; gap:3px; }
  .item .k{ font-size:8px; color:var(--text-lo); text-transform:uppercase; letter-spacing:1.2px; }
  .item .v{ font-size:12.5px; color:var(--text-hi); font-weight:600; }

  .item.patient .holo{ width:46px; height:46px; border-radius:14px; font-size:18px;
    background:linear-gradient(135deg, #4f8ce6, #966de6, #38d6c4); }
  .item.patient .v{ font-size:17px; font-weight:700; letter-spacing:.2px; }
  .item.patient{ padding-right:22px; margin-right:4px; border-right:1px solid rgba(255,255,255,.08); }

  .spacer{ flex:1; }
  .mod{
    display:flex; align-items:center; gap:8px;
    border-radius:12px; padding:9px 18px; flex-shrink:0;
    background:linear-gradient(135deg, #4f8ce6, #966de6, #38d6c4, #e64f7a);
    background-size:300% 300%;
  }
  .mod .v{ color:#060810; font-weight:800; font-size:12px; letter-spacing:.6px; }
</style>
</head>
<body>
  <div class="strip">
    <div class="item patient"><div class="holo">👤</div><div class="tx"><span class="k">Hasta Adı</span><span class="v">SAMIKIRAN RAMAZAN</span></div></div>
    <div class="item"><div class="holo">🪪</div><div class="tx"><span class="k">Hasta TC</span><span class="v">58237416354</span></div></div>
    <div class="item"><div class="holo">🎂</div><div class="tx"><span class="k">Doğum</span><span class="v">01.07.1964</span></div></div>
    <div class="item"><div class="holo">📋</div><div class="tx"><span class="k">Tetkik</span><span class="v">BT, Toraks, Kontrastlı</span></div></div>
    <div class="item"><div class="holo">🕐</div><div class="tx"><span class="k">Çekim</span><span class="v">08.08.2026 00:57</span></div></div>
    <div class="item"><div class="holo">#</div><div class="tx"><span class="k">Acc No</span><span class="v">QKZ505048505</span></div></div>
    <div class="item"><div class="holo">📚</div><div class="tx"><span class="k">Seri/Görüntü</span><span class="v">3/6 · 155/737</span></div></div>
    <div class="item"><div class="holo">◐</div><div class="tx"><span class="k">WL/WW</span><span class="v">40 / 400</span></div></div>
    <div class="spacer"></div>
    <div class="mod"><span class="v">CT · ORIGINAL</span></div>
  </div>
</body>
</html>
