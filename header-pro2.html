<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel 2 — Yapısal Panel</title>
<style>
  :root{
    --bg:#0b0e12; --line:#212630; --text-hi:#e1e5ec; --text-md:#8892a0; --text-lo:#565e6c;
    --accent:#3fa88a; --accent-bg:rgba(63,168,138,0.10); --accent-line:#2a6e5a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  svg.ic{ width:15px; height:15px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .strip{
    height:72px; display:flex; align-items:stretch; gap:0;
    background:#0f1216; border-bottom:1px solid var(--line);
    padding:10px; white-space:nowrap; overflow:hidden; gap:10px;
  }
  .id-panel{
    display:flex; align-items:center; gap:12px;
    background:#151920; border:1px solid var(--line); border-radius:8px;
    padding:0 18px; flex-shrink:0;
  }
  .id-panel .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--accent-bg); border:1.5px solid var(--accent);
    display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0;
  }
  .id-panel .tx .v{ font-size:14.5px; font-weight:700; color:var(--text-hi); }
  .id-panel .tx .k{ font-size:9px; color:var(--text-lo); text-transform:uppercase; letter-spacing:.6px; margin-bottom:3px; }

  .fields-panel{
    flex:1; display:flex; align-items:center; gap:22px; overflow:hidden;
    background:#151920; border:1px solid var(--line); border-radius:8px; padding:0 20px;
  }
  .item{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .item .ic-wrap{ color:var(--text-lo); flex-shrink:0; display:flex; }
  .item .tx{ display:flex; flex-direction:column; gap:3px; }
  .item .k{ font-size:8.5px; color:var(--text-lo); text-transform:uppercase; letter-spacing:.5px; }
  .item .v{ font-size:11.5px; color:var(--text-hi); font-weight:500; }

  .spacer{ display:none; }
  .mod{
    display:flex; align-items:center; gap:7px;
    background:var(--accent); border-radius:8px;
    padding:0 18px; flex-shrink:0; color:#06120e;
  }
  .mod .v{ font-weight:700; font-size:11.5px; letter-spacing:.5px; }
</style>
</head>
<body>
<svg style="display:none">
<defs>
<symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></symbol>
<symbol id="ic-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M6.5 16c.5-1.5 1.5-2.2 2-2.2s1.5.7 2 2.2"/><path d="M14 10h4M14 13h4M14 16h2.5"/></symbol>
<symbol id="ic-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="ic-clip" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><path d="M8.5 11.5l2 2 4.5-4.5M8.5 16h6"/></symbol>
<symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></symbol>
<symbol id="ic-hash" viewBox="0 0 24 24"><path d="M9 3.5L6.5 20.5M17.5 3.5L15 20.5M4 9h17M3.3 15.3h17"/></symbol>
<symbol id="ic-layers" viewBox="0 0 24 24"><path d="M12 3l8.5 4.6L12 12.2 3.5 7.6 12 3z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 17.4L12 22l8.5-4.6"/></symbol>
<symbol id="ic-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4.5 17.5l5-5.2 3 3 3.2-3.6 4.3 5.8"/></symbol>
<symbol id="ic-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
<symbol id="ic-scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.4"/></symbol>
</defs>
</svg>
  <div class="strip">
    <div class="id-panel">
      <div class="avatar"><svg class="ic"><use href="#ic-user"/></svg></div>
      <div class="tx"><div class="k">Hasta Adı</div><div class="v">Samıkıran Ramazan</div></div>
    </div>
    <div class="fields-panel">
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-id"/></svg></span><div class="tx"><span class="k">Hasta TC</span><span class="v">58237416354</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-cal"/></svg></span><div class="tx"><span class="k">Doğum Tarihi</span><span class="v">01.07.1964</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-clip"/></svg></span><div class="tx"><span class="k">Tetkik</span><span class="v">BT, Toraks, Kontrastlı</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-clock"/></svg></span><div class="tx"><span class="k">Çekim Tarihi/Saat</span><span class="v">08.08.2026 00:57</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-hash"/></svg></span><div class="tx"><span class="k">Accession No</span><span class="v">QKZ505048505</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-layers"/></svg></span><div class="tx"><span class="k">Seri / Görüntü</span><span class="v">3/6 · 155/737</span></div></div>
      <div class="item"><span class="ic-wrap"><svg class="ic"><use href="#ic-contrast"/></svg></span><div class="tx"><span class="k">WL / WW</span><span class="v">40 / 400</span></div></div>
    </div>
    <div class="mod"><svg class="ic"><use href="#ic-scan"/></svg><span class="v">CT · ORIGINAL</span></div>
  </div>
</body>
</html>
