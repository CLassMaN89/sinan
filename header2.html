<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Başlık 2 — Mücevher Işıltılı</title>
<style>
  :root{
    --bg:#0a0805; --line:#2c2517; --text-hi:#f0e6d2; --text-md:#a89a7a; --text-lo:#6b6148;
    --gold:#e8c073;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }

  .strip{
    height:88px; position:relative; display:flex; align-items:center; gap:22px;
    background:
      radial-gradient(ellipse 50% 160% at 0% 50%, rgba(232,192,115,0.08) 0%, transparent 70%),
      linear-gradient(180deg,#151109 0%,#0d0a06 100%);
    border-bottom:1px solid #3a2f1a;
    padding:0 28px; white-space:nowrap; overflow:hidden;
  }
  .strip::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent); opacity:.6; }

  .item{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .gem{
    width:36px; height:36px; flex-shrink:0;
    background:linear-gradient(135deg,#3a2f1a,#1a1509);
    border:1px solid #5c4a26;
    transform:rotate(45deg); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 10px rgba(232,192,115,.15), inset 0 0 8px rgba(232,192,115,.08);
  }
  .gem span{ transform:rotate(-45deg); font-size:14px; color:var(--gold); }
  .item .tx{ display:flex; flex-direction:column; gap:3px; }
  .item .k{ font-size:8px; color:var(--text-lo); text-transform:uppercase; letter-spacing:1px; }
  .item .v{ font-size:12.5px; color:var(--text-hi); font-weight:500; }

  .item.patient .gem{ width:48px; height:48px; }
  .item.patient .gem span{ font-size:19px; }
  .item.patient .v{ font-family:Georgia, serif; font-size:19px; font-weight:600; color:#fff8ea; }
  .item.patient{ padding-right:24px; margin-right:2px; border-right:1px solid #3a2f1a; }

  .spacer{ flex:1; }
  .mod{
    display:flex; align-items:center; gap:9px;
    border:1px solid var(--gold); border-radius:4px; padding:9px 20px; flex-shrink:0;
    background:linear-gradient(180deg, rgba(232,192,115,.14), rgba(232,192,115,.03));
    box-shadow:0 0 20px rgba(232,192,115,.25);
  }
  .mod .v{ color:var(--gold); font-weight:700; font-size:12px; letter-spacing:1.5px; }
</style>
</head>
<body>
  <div class="strip">
    <div class="item patient"><div class="gem"><span>♛</span></div><div class="tx"><span class="k">Hasta Adı</span><span class="v">Samıkıran Ramazan</span></div></div>
    <div class="item"><div class="gem"><span>🪪</span></div><div class="tx"><span class="k">Hasta TC</span><span class="v">58237416354</span></div></div>
    <div class="item"><div class="gem"><span>🎂</span></div><div class="tx"><span class="k">Doğum Tarihi</span><span class="v">01.07.1964</span></div></div>
    <div class="item"><div class="gem"><span>📋</span></div><div class="tx"><span class="k">Tetkik</span><span class="v">BT, Toraks, Kontrastlı</span></div></div>
    <div class="item"><div class="gem"><span>🕐</span></div><div class="tx"><span class="k">Çekim Tarihi/Saat</span><span class="v">08.08.2026 00:57</span></div></div>
    <div class="item"><div class="gem"><span>#</span></div><div class="tx"><span class="k">Accession No</span><span class="v">QKZ505048505</span></div></div>
    <div class="item"><div class="gem"><span>📚</span></div><div class="tx"><span class="k">Seri / Görüntü</span><span class="v">3/6 · 155/737</span></div></div>
    <div class="item"><div class="gem"><span>◐</span></div><div class="tx"><span class="k">WL / WW</span><span class="v">40 / 400</span></div></div>
    <div class="spacer"></div>
    <div class="mod"><span class="v">CT · ORIGINAL</span></div>
  </div>
</body>
</html>
